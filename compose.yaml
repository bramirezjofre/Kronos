services:
  kronos:
    build: .
    image: kronos:local
    working_dir: /app
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - hf-cache:/cache/huggingface
    ports: ["${KRONOS_PORT:-8000}:8000"]
    command: ["-m", "scripts.kronos_service"]
    healthcheck:
      # Readiness loads the real checkpoint; a live process without a model is unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  hf-cache:
